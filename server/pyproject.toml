[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sugar-local-mcp"
version = "0.6.0"
authors = [{name = "Sugar"}]
description = "Codex Local MCP by Sugar: a local project and managed process bridge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0"]

[project.scripts]
codex-local-mcp = "sugar_local_mcp.cli:main"
sugar-local-mcp = "sugar_local_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
